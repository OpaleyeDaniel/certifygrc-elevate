<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
    <title>CertifyGRC | Smarter Governance, Safer Decisions</title>
    <meta name="description" content="CertifyGRC delivers practical GRC solutions — software, consulting, and training — to simplify compliance, manage risk, and drive governance excellence." />
    <meta name="author" content="CertifyGRC" />
    <link rel="canonical" href="https://certifygrc.com" />
  
    <link rel="icon" type="image/svg+xml" href="/certifygrc-mark.svg" />
    <link rel="icon" type="image/png" href="/certifygrc-mark.png" sizes="32x32" />
    <link rel="shortcut icon" href="/certifygrc-mark.png" />
    <link rel="apple-touch-icon" href="/certifygrc-mark.png" />
  
    <meta property="og:title" content="CertifyGRC — Smarter Governance, Safer Decisions" />
    <meta property="og:description" content="Practical GRC Solutions — Simplified, Intelligent, Secure" />
    <meta property="og:type" content="website" />
  
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Default dark on first visit; respect saved light/dark before paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("certifygrc-theme");
          var theme = stored === "light" || stored === "dark" ? stored : "dark";
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <style>
      body {
        background-color: #f7f8fb;
        margin: 0;
      }
      html.dark body {
        background-color: #05070d;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
